plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.vrunity.vrapk'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'com.vrunity.vrapk'
        minSdk 29
        targetSdk 34
        versionCode 1790975519
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Sounds and clips are played straight from the app's own files, so they are
    // stored where the device's own player can read them.
    aaptOptions {
        noCompress 'mp3', 'wav', 'ogg', 'oga', 'm4a', 'aac', 'opus', 'flac'
        noCompress 'mp4', 'm4v', 'mov', 'webm', 'mkv'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
