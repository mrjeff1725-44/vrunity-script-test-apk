name: Build VR APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Install the Android NDK
        run: echo "y" | sudo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" > /dev/null
      - name: Fetch the headset VR runtime
        run: |
          curl -sSL -o openxr.aar https://repo1.maven.org/maven2/org/khronos/openxr/openxr_loader_for_android/1.1.49/openxr_loader_for_android-1.1.49.aar
          mkdir -p app/src/main/cpp/openxr app/src/main/jniLibs/arm64-v8a
          unzip -o -q -j openxr.aar 'prefab/modules/headers/include/openxr/*' -d app/src/main/cpp/openxr
          unzip -o -q -j openxr.aar 'jni/arm64-v8a/libopenxr_loader.so' -d app/src/main/jniLibs/arm64-v8a
          rm openxr.aar
      - name: Fetch the scene's own models and images
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          path = 'app/src/main/assets/media.json'
          if not os.path.exists(path):
              raise SystemExit(0)
          out = 'app/src/main/assets/media'
          os.makedirs(out, exist_ok=True)
          for entry in json.load(open(path)):
              target = os.path.join(out, entry['file'])
              url = entry['url']
              try:
                  # A small file travels inside the list itself; anything else is
                  # fetched from where the app put it.
                  if url.startswith('data:'):
                      head, data = url.split(',', 1)
                      open(target, 'wb').write(base64.b64decode(data))
                  else:
                      urllib.request.urlretrieve(url, target)
                  print('added', entry['file'])
              except Exception as e:
                  print('could not add', entry['file'], e)
          PY
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Prepare the debug signing key
        run: |
          mkdir -p "$RUNNER_TEMP/.android"
          keytool -genkeypair -keystore "$RUNNER_TEMP/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Build the game
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}
        run: gradle assembleDebug --no-daemon
      - name: Name the finished APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/script-test.apk"
      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: VR game build ${{ github.run_id }}
          files: app/build/outputs/apk/debug/script-test.apk
